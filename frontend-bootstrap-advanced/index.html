<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <!-- Bootstrap CSS (loaded from the internet) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Our own small styles -->
    <link rel="stylesheet" href="style.css?v=product-1">
</head>
<body class="bg-light">

    <!-- ===== Top navigation bar ===== -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">📦 Product Management</span>
            <a class="btn btn-outline-light btn-sm" href="http://127.0.0.1:8000/docs" target="_blank">API Docs</a>
        </div>
    </nav>

    <div class="container">

        <!-- ===== Message (success / error) ===== -->
        <div id="message" class="alert d-none" role="alert"></div>

        <!-- ===== Product Add / Edit Form ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0" id="form-title">Add New Product</h5>
            </div>
            <div class="card-body">
                <form id="product-form">
                    <!-- row = one line, col-md-3 = 4 boxes per line (12 / 3 = 4) -->
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Wireless Mouse" required>
                        </div>
                        <div class="col-md-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" placeholder="e.g. Electronics" required>
                        </div>
                        <div class="col-md-3">
                            <label for="brand" class="form-label">Brand</label>
                            <input type="text" class="form-control" id="brand" placeholder="e.g. Logitech" required>
                        </div>
                        <div class="col-md-3">
                            <label for="email" class="form-label">Supplier Email</label>
                            <input type="email" class="form-control" id="email" placeholder="e.g. sales@supplier.com" required>
                        </div>

                        <div class="col-md-3">
                            <label for="sku" class="form-label">SKU (unique code)</label>
                            <input type="text" class="form-control" id="sku" placeholder="e.g. P-101" pattern="[A-Za-z0-9_\-]+" title="Letters, digits, - and _ only" maxlength="30" required>
                        </div>
                        <div class="col-md-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" class="form-control" id="price" placeholder="e.g. 850" min="0" step="0.01">
                        </div>
                        <div class="col-md-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" placeholder="e.g. 40" min="0">
                        </div>
                        <div class="col-md-3">
                            <label for="reorder" class="form-label">Reorder Level</label>
                            <input type="number" class="form-control" id="reorder" placeholder="e.g. 10" min="0">
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Add Product</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancel-btn" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== Product List Table ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">All Products</h5>
                <span class="badge bg-primary" id="total">0 products</span>
            </div>
            <div class="card-body p-0">
                <!-- table-responsive = table scrolls on small screens -->
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>SKU</th><th>Name</th><th>Category</th><th>Brand</th><th>Supplier Email</th>
                                <th>Price</th><th>Quantity</th><th>Reorder Level</th>
                                <th>Stock Value</th><th>Status</th><th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="product-table">
                            <!-- JavaScript will add the rows here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Our JavaScript -->
    <script src="script.js?v=product-1"></script>
</body>
</html>
