<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-4">Product Management</h1>

    <!-- ===== Form ===== -->
    <h3 id="form-title">Add Product</h3>

    <form id="product-form">
        <label>Name</label>
        <input type="text" id="name" class="form-control mb-2" required>

        <label>Category</label>
        <input type="text" id="category" class="form-control mb-2" required>

        <label>Brand</label>
        <input type="text" id="brand" class="form-control mb-2" required>

        <label>Supplier Email</label>
        <input type="email" id="email" class="form-control mb-2" required>

        <label>SKU (unique code, e.g. P-101)</label>
        <input type="text" id="sku" class="form-control mb-2" pattern="[A-Za-z0-9_\-]+" title="Letters, digits, - and _ only" maxlength="30" required>

        <label>Price</label>
        <input type="number" id="price" class="form-control mb-2" min="0" step="0.01">

        <label>Quantity</label>
        <input type="number" id="quantity" class="form-control mb-2" min="0">

        <label>Reorder Level</label>
        <input type="number" id="reorder" class="form-control mb-3" min="0">

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <!-- ===== Table ===== -->
    <h3 class="mt-5">All Products</h3>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>SKU</th>
                <th>Name</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Supplier Email</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Reorder Level</th>
                <th>Stock Value</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="product-table"></tbody>
    </table>

</div>

<script src="script.js?v=product-1"></script>
</body>
</html>
